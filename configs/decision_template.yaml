# DECISION-SUPPORT TEMPLATE.
# Point data paths at documented real market history (schema: docs/financial_conventions.md)
# and set every UNAPPROVED value through the risk team. Missing data stops the run with
# MissingDataError; the engine never substitutes the synthetic demo fixture.
run:
  mode: decision_support
  name: decision
  output_root: runs
  master_seed: 20261004
  as_of: 2026-10-04

paths:
  development: 2000
  validation: 10000
  stress: 2000
  sensitivity: 2000
  stability_checkpoints: [1000, 2500, 5000, 10000]
  paths_per_param_draw: 1
  runtime_budget_seconds: 1800
  audit_paths: 5
  ledger_sample_paths: 200
  provenance: "engineering default: small development screen, 10,000-path frozen validation batch"

data:
  format: monthly
  returns_file: ../data/real/monthly_returns.csv
  curve_file: ../data/real/curve_snapshot.csv
  source_manifest: ../data/real/SOURCE_MANIFEST.yaml
  release_lag_months: 1
  training_start: null
  curve_max_staleness_days: 120
  reject_stale_inputs: true
  max_years_since_last_complete: 2
  holdings_file: ../data/real/holdings.csv
  lookthrough_file: ../data/real/lookthrough.csv

forecast:
  method: niw
  # candidate models, validated in this order by the same validator; first PASS is selected
  candidates: [niw, bvar]
  fallback_order: [bootstrap, assumption]
  evaluation_freeze: ../data/real/forecast_evaluation_freeze.json   # create with `wharton-engine freeze-evaluation`
  prior:
    # annual LOG gross returns / log CPI growth; weakly informative
    mean_log: {equity: 0.065, treasury: 0.035, cash: 0.025, inflation: 0.025}
    vol_log: {equity: 0.16, treasury: 0.06, cash: 0.012, inflation: 0.012}
    correlation:
      - [1.00, -0.10, 0.00, -0.05]
      - [-0.10, 1.00, 0.30, -0.10]
      - [0.00, 0.30, 1.00, 0.40]
      - [-0.05, -0.10, 0.40, 1.00]
    kappa0: 2.0      # prior mean worth ~2 years of data
    nu0: 8.0         # > d + 1 = 5, so E[Sigma] = Psi0 / (nu0 - 5) is finite
    empirical_bayes: false
    provenance: "ILLUSTRATIVE engineering prior; not estimated from data; not team-approved"
  checks:
    min_annual_obs: 20
    initial_window_years: 15
    interval_levels: [0.8, 0.95]
    coverage_tolerance: {"0.8": 0.15, "0.95": 0.10}
    max_mean_lpd_deficit_vs_fixed: 0.25
    ppc_reps: 1000
    ppc_pvalue_bounds: [0.01, 0.99]
    extreme_abs_log_return: 3.0
    max_extreme_fraction: 0.001
    multi_year_horizon: 5
    gate_horizons: [1, 5]
    report_horizons: [6]
    min_one_year_origins: 10
    min_multi_year_effective_n: 10
    gate_series: [equity, treasury, cash, inflation]
    gate_dependence_ppc: [cash_lag1_autocorr, inflation_lag1_autocorr]
    validation_draws: 2000
    crps_draws: 2000
    provenance: "engineering default model-gate tolerances, fixed before candidate comparison"
  bootstrap: {block_months: 12, min_years: 20}
  bvar:
    own_lag_prior_mean: {equity: 0.0, treasury: 0.0, cash: 0.7, inflation: 0.5}
    lag_tightness: 0.3
    intercept_var: 100.0
    max_spectral_radius: 0.995
    provenance: "ILLUSTRATIVE persistence prior for the BVAR(1) candidate; not team-approved"
  assumption:
    mean_log: {equity: 0.060, treasury: 0.033, cash: 0.025, inflation: 0.025}
    vol_log: {equity: 0.17, treasury: 0.065, cash: 0.012, inflation: 0.012}
    correlation:
      - [1.00, -0.10, 0.00, -0.05]
      - [-0.10, 1.00, 0.30, -0.10]
      - [0.00, 0.30, 1.00, 0.40]
      - [-0.05, -0.10, 0.40, 1.00]
    provenance: "ILLUSTRATIVE stated assumptions for the fallback; not a forecast"
  fixed_cov_shrinkage: 0.3

curves:
  base_scenario: unchanged_snapshot
  planning_scenario: unchanged_snapshot
  scenarios:
    unchanged_snapshot: {kind: snapshot_shift, shift: 0.0, description: "2026 snapshot curve held unchanged to 2033"}
    lower_yields: {kind: snapshot_shift, shift: -0.015, description: "snapshot -150bp parallel"}
    higher_yields: {kind: snapshot_shift, shift: 0.015, description: "snapshot +150bp parallel"}
    zero_rate: {kind: flat, rate: 0.0, description: "flat 0% (accounting identity case)"}
  provenance: "named 2033 curve ASSUMPTIONS; results are conditional on the chosen scenario, not probabilities"

costs:
  transaction_cost_rate: 0.0010
  annual_fee_rate: 0.0005
  reserve_purchase_spread: 0.0010
  facility_liquidation_cost_rate: 0.0010
  provenance: "ILLUSTRATIVE frictions; not quoted broker or fund costs"

policy_file: risk_policy_readiness.yaml
candidates_file: candidates_readiness.yaml
stress_file: stress_suite.yaml   # ST1-ST4 must be added (definitions not supplied)

conditional_2031:
  interval_coverage: 0.80
  representative_quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
  inner_paths: 2000
  calibration_states: 100
  calibration_inner_paths: 400
  update_rule: posterior_update
  compare_frozen_belief: true
  rounding_dollars: 5000
  frozen_candidate: auto

sensitivity:
  enabled: true
  prior_kappa_multipliers: [0.25, 4.0]
  recent_window_years: 20
  curve_scenarios: [lower_yields, higher_yields]
  cost_multiplier: 3.0
  include_fixed_cov_model: true

optional:
  logistic: {enabled: false, status: research}
  evt: {enabled: false, status: research}
