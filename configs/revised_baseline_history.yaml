run:
  mode: decision_support
  name: revised_baseline_history
  output_root: runs
  master_seed: 2026101102
  as_of: '2026-10-11'
paths:
  development: 5000
  validation: 50000
  stress: 50000
  sensitivity: 5000
  stability_checkpoints:
  - 1000
  - 5000
  - 10000
  - 25000
  - 50000
  paths_per_param_draw: 1
  runtime_budget_seconds: 1800
  audit_paths: 5
  ledger_sample_paths: 200
  provenance: 'Packet evidence setting: 50000 fresh validation paths and 50000 per
    mandatory stress'
data:
  format: annual
  returns_file: ../data/public_20261011/annual_returns.csv
  curve_file: ../data/public_20261011/curve_snapshot.csv
  source_manifest: ../data/public_20261011/SOURCE_MANIFEST.yaml
  release_lag_months: 1
  training_start: null
  curve_max_staleness_days: 120
forecast:
  method: niw
  fallback_order:
  - bootstrap
  - assumption
  prior:
    mean_log:
      equity: 0.065
      treasury: 0.035
      cash: 0.025
      inflation: 0.025
    vol_log:
      equity: 0.16
      treasury: 0.06
      cash: 0.012
      inflation: 0.012
    correlation:
    - - 1.0
      - -0.1
      - 0.0
      - -0.05
    - - -0.1
      - 1.0
      - 0.3
      - -0.1
    - - 0.0
      - 0.3
      - 1.0
      - 0.4
    - - -0.05
      - -0.1
      - 0.4
      - 1.0
    kappa0: 2.0
    nu0: 8.0
    empirical_bayes: false
    provenance: ILLUSTRATIVE engineering prior; not estimated from data; not team-approved
  checks:
    min_annual_obs: 20
    initial_window_years: 15
    interval_levels:
    - 0.8
    - 0.95
    coverage_tolerance:
      '0.8': 0.15
      '0.95': 0.1
    max_mean_lpd_deficit_vs_fixed: 0.25
    ppc_reps: 1000
    ppc_pvalue_bounds:
    - 0.01
    - 0.99
    extreme_abs_log_return: 3.0
    max_extreme_fraction: 0.001
    multi_year_horizon: 5
    crps_draws: 2000
    provenance: engineering default model-gate tolerances, fixed before candidate
      comparison
  bootstrap:
    block_months: 12
    min_years: 15
  assumption:
    mean_log:
      equity: 0.06
      treasury: 0.033
      cash: 0.025
      inflation: 0.025
    vol_log:
      equity: 0.17
      treasury: 0.065
      cash: 0.012
      inflation: 0.012
    correlation:
    - - 1.0
      - -0.1
      - 0.0
      - -0.05
    - - -0.1
      - 1.0
      - 0.3
      - -0.1
    - - 0.0
      - 0.3
      - 1.0
      - 0.4
    - - -0.05
      - -0.1
      - 0.4
      - 1.0
    provenance: ILLUSTRATIVE stated assumptions for the fallback; not a forecast
  fixed_cov_shrinkage: 0.3
  retain_failed_primary_diagnostics: true
curves:
  base_scenario: unchanged_snapshot
  planning_scenario: unchanged_snapshot
  scenarios:
    unchanged_snapshot:
      kind: snapshot_shift
      shift: 0.0
      description: 2026 snapshot curve held unchanged to 2033
    lower_yields:
      kind: snapshot_shift
      shift: -0.02
      description: Snapshot zero curve -200bp per packet ST3
    higher_yields:
      kind: snapshot_shift
      shift: 0.015
      description: snapshot +150bp parallel
    zero_rate:
      kind: flat
      rate: 0.0
      description: flat 0% (accounting identity case)
  provenance: named 2033 curve ASSUMPTIONS; results are conditional on the chosen
    scenario, not probabilities
costs:
  transaction_cost_rate: 0.001
  annual_fee_rate: 0.0015
  reserve_purchase_spread: 0.001
  facility_liquidation_cost_rate: 0.001
  provenance: Other packet-run frictions unchanged; annual fee raised from 5bp to
    15bp to cover indicative IVV/IEF fund expenses. Thresholds unchanged.
policy_file: risk_policy_team.yaml
candidates_file: candidates_revised_baseline.yaml
stress_file: stress_team.yaml
conditional_2031:
  interval_coverage: 0.8
  representative_quantiles:
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  inner_paths: 2000
  calibration_states: 100
  calibration_inner_paths: 400
  update_rule: posterior_update
  compare_frozen_belief: true
  rounding_dollars: 5000
  frozen_candidate: revised_baseline
sensitivity:
  enabled: false
  prior_kappa_multipliers:
  - 0.25
  - 4.0
  recent_window_years: 20
  curve_scenarios:
  - lower_yields
  - higher_yields
  cost_multiplier: 3.0
  include_fixed_cov_model: true
optional:
  logistic:
    enabled: false
    status: research
  evt:
    enabled: false
    status: research
