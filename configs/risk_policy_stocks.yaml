policy_id: risk-team-20261011-direct-stocks-20261018
version: 1.0-fixed-plus-executable-concentration
status: PRESET_AWAITING_REVIEW
effective_date: '2026-10-11'
provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen before
  candidate results; thresholds preserved from SidChellappan/wharton_engine d9796fe;
  no ETFs requested 2026-10-18
approval:
  approved: false
  reviewers: []
  approval_date: null
  notes: No human approval supplied. Final investment approval is outside the software.
one_sided_confidence: 0.95
expected_shortfall_tail: 0.05
max_equity: 0.65
permitted_assets:
- equity
- treasury
- cash
min_retention_fraction: 0.25
retained_dollar_floor: 50000
retained_dollar_floor_provenance: Decision Inputs!D14
rules:
- id: funding_confidence
  kind: min_probability
  metric: p_all_payments
  threshold: 0.95
  use_lower_bound: true
  description: P(all ten payments full and on time); lower one-sided MC bound must
    exceed target
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: reserve_establishment
  kind: min_probability
  metric: p_full_reserve
  threshold: 0.95
  use_lower_bound: true
  description: P(full matched reserve purchased at beginning 2033)
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: shortfall_tail
  kind: max_value
  metric: es_unpaid
  threshold: 50000
  description: mean unpaid dollars in the worst 5% of paths (empirical tail average)
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: drawdown
  kind: max_value
  metric: p95_max_drawdown
  threshold: 0.3
  description: 95th percentile of the flow-adjusted maximum investment drawdown
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: forced_sales
  kind: max_probability
  metric: p_payment_requires_sale
  threshold: 0.05
  description: P(any payment requires selling risk assets because reserve cash is
    short)
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
  use_upper_bound: true
- id: max_equity
  kind: exposure_limit
  threshold: 0.65
  description: maximum equity weight in any year (asset-class level)
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: permitted_assets
  kind: permitted_assets
  allowed:
  - equity
  - treasury
  - cash
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: min_retention
  kind: min_value
  metric: retention_fraction
  threshold: 0.25
  description: retain at least 25% of post-reserve surplus as flexibility
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: issuer_concentration
  kind: concentration
  hard: true
  description: 5% per issuer stock / 20% per equity sector; individual stocks only,
    no ETFs
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
  params:
    stock_limit: 0.05
    sector_limit: 0.2
    sector_scope:
    - stock
    exemptions: []
    drift_check: required
    interpretation_status: 'Research interpretation: stock issuer and equity sector;
      future drift evidence required'
- id: stress_resilience
  kind: stress_min_probability
  threshold: 0.9
  use_lower_bound: true
  stress_ids:
  - ST1
  - ST2
  - ST3
  - ST4
  description: conditional P(all payments) under each mandatory stress (a condition,
    not a probability)
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: mc_precision
  kind: max_interval_width
  metric: p_all_payments
  threshold: 0.01
  description: two-sided 95% Monte Carlo interval width for P(all payments)
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: forecast_evidence
  kind: forecast_status
  required: PASS
  description: forecast model (or validated bootstrap fallback) passed predeclared
    checks
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: real_data
  kind: data_kind
  required: market_history
  enabled: true
  description: decision support requires documented market history
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
- id: retained_dollar_floor
  kind: min_value
  metric: retention_dollar_floor
  threshold: 50000
  description: Keep $50k when surplus permits; otherwise contribute zero to facility
  provenance: User request 2026-10-11 and workbook preset cells; thresholds frozen
    before candidate results
