version: packet-four-stresses-1.0
provenance: Stress Suite!D4:E7; no stress changes after results
scenarios:
- id: ST1
  category: 1
  description: Additional 35% equity crash immediately before 2033 reserve purchase,
    after base 2032 return
  shocks:
  - asset: equity
    years:
    - 2032
    mode: multiply_gross
    value: -0.35
- id: ST2
  category: 2
  description: 2029-2031 equity -10% annually; Treasury and cash +1% annually
  shocks:
  - asset: equity
    years:
    - 2029
    - 2030
    - 2031
    mode: override_simple
    value: -0.1
  - asset: treasury
    years:
    - 2029
    - 2030
    - 2031
    mode: override_simple
    value: 0.01
  - asset: cash
    years:
    - 2029
    - 2030
    - 2031
    mode: override_simple
    value: 0.01
- id: ST3
  category: 3
  description: 2033 reserve-purchase zero curve 200bp below base
  curve_scenario: lower_yields
- id: ST4
  category: 4
  description: Additional 0.50% annual cost on total invested assets 2027-2041; paid
    from unreserved first
  additional_annual_cost_rate: 0.005
